<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__ — 実装レビュー</title>
    <!-- highlight.js テーマ（同梱・インライン）。下の主 style より前に置き、コンテナ配色は主 style で上書き -->
    <style>/*__HLJS_CSS__*/</style>
    <style>
      :root {
        --bg: #fbfbfa;
        --surface: #fff;
        --sunken: #f4f4f1;
        --ink: #1b1d1c;
        --soft: #5b625e;
        --faint: #8a908c;
        --line: #e8e8e4;
        --line2: #d6d7d1;
        --brand: #1f7a5a;
        --brand-deep: #155c43;
        --brand-soft: #e8f3ed;
        --cta: #f2683c;
        --cta-soft: #fdeee8;
        --flag: #d8472b;
        --flag-soft: #fbe9e5;
        --amber: #f4b740;
        --hi: #fff1b8;
        --hi-active: #ffd866;
        --panel-w: 360px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.75;
        font-size: 15px;
      }
      a { color: var(--brand-deep); }

      /* ── top bar ─────────────────────────── */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 10px 18px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .topbar h1 { font-size: 16px; margin: 0; font-weight: 700; }
      .topbar .sub { color: var(--faint); font-size: 12px; }
      .spacer { flex: 1; }
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        border: 1.5px solid var(--line2);
        background: var(--surface);
        color: var(--ink);
        padding: 7px 13px;
        border-radius: 999px;
        cursor: pointer;
      }
      .btn:hover { border-color: var(--brand); color: var(--brand-deep); }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      .btn.primary:hover { background: var(--brand-deep); color: #fff; }
      .btn.danger:hover { border-color: var(--flag); color: var(--flag); }
      .count {
        font-size: 12px;
        font-weight: 700;
        color: var(--brand-deep);
        background: var(--brand-soft);
        padding: 4px 10px;
        border-radius: 999px;
      }

      /* ── layout ──────────────────────────── */
      .layout { display: flex; align-items: flex-start; }
      #doc {
        flex: 1;
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 32px 120px;
      }
      #panel {
        position: sticky;
        top: 53px;
        width: var(--panel-w);
        height: calc(100vh - 53px);
        overflow-y: auto;
        border-left: 1px solid var(--line);
        background: var(--surface);
        padding: 16px;
        flex-shrink: 0;
      }

      /* ── doc typography ──────────────────── */
      #doc h2 {
        font-size: 24px;
        margin: 44px 0 6px;
        padding-top: 14px;
        border-top: 2px solid var(--line);
      }
      #doc h2 .no {
        display: inline-block;
        min-width: 1.6em;
        color: var(--brand);
        font-variant-numeric: tabular-nums;
      }
      #doc h3 { font-size: 17px; margin: 26px 0 6px; color: var(--brand-deep); }
      #doc p { margin: 10px 0; }
      #doc ul, #doc ol { margin: 10px 0; padding-left: 1.3em; }
      #doc li { margin: 4px 0; }
      #doc code { font-family: var(--mono); font-size: 0.88em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
      #doc pre {
        background: #f3f6f4;
        color: #20302a;
        border: 1px solid var(--line2);
        border-radius: 12px;
        padding: 14px 16px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.65;
        margin: 14px 0;
      }
      #doc pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
      /* highlight.js: トークン色はテーマに任せ、コンテナ背景はこちらの淡色を維持 */
      #doc pre code.hljs { background: transparent; padding: 0; }
      .lead { color: var(--soft); font-size: 15.5px; }
      .hero {
        background: linear-gradient(160deg, var(--brand-soft), #fff);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px 24px;
        margin-bottom: 8px;
      }
      .hero h2 { border: none; margin-top: 0; padding-top: 0; }
      .tag {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 999px;
        background: var(--sunken);
        color: var(--soft);
        margin: 2px 3px 2px 0;
      }
      .tag.ok { background: var(--brand-soft); color: var(--brand-deep); }
      .tag.cta { background: var(--cta-soft); color: var(--cta); }
      .tag.flag { background: var(--flag-soft); color: var(--flag); }

      table.grid { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
      table.grid th, table.grid td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
      table.grid th { background: var(--sunken); font-weight: 600; }
      table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .good td { background: var(--brand-soft); }

      .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
      .sw { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .sw i { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(0,0,0,.08); display: block; }

      figure { margin: 16px 0; }
      figure img.shot {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 6px 22px rgba(0,0,0,.08);
        display: block;
      }
      figure.sp { max-width: 300px; }
      figcaption { color: var(--faint); font-size: 12px; margin-top: 6px; }
      .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }

      .fsd { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
      .fsd .lyr {
        display: flex; align-items: center; gap: 12px;
        border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface);
      }
      .fsd .lyr b { width: 92px; color: var(--brand-deep); }
      .fsd .arrow { text-align: center; color: var(--faint); font-size: 12px; }
      .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
      .flow .step { background: var(--brand-soft); color: var(--brand-deep); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
      .flow .step.alt { background: var(--cta-soft); color: var(--cta); }
      .flow .sep { color: var(--faint); }
      .note { background: var(--sunken); border-left: 3px solid var(--brand); border-radius: 0 10px 10px 0; padding: 10px 14px; margin: 14px 0; font-size: 14px; }
      .pt { background: var(--cta-soft); border-left-color: var(--cta); }

      /* ── mermaid 図 ───────────────────────── */
      .mermaid {
        margin: 16px 0;
        padding: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
        overflow-x: auto;
        /* 描画前のソーステキストは隠す（チラつき防止）。描画後 mermaid が data-processed を付ける */
        font-size: 0;
        line-height: 0;
      }
      .mermaid[data-processed] { font-size: inherit; line-height: inherit; }
      .mermaid svg { max-width: 100%; height: auto; }
      .mermaid + figcaption, figure > .mermaid + figcaption { text-align: center; }

      /* ── highlight + panel ───────────────── */
      mark.cmt { background: var(--hi); border-radius: 3px; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 1px; }
      mark.cmt.active { background: var(--hi-active); }
      #floatBtn {
        position: absolute;
        z-index: 80;
        display: none;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        background: var(--ink);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 7px 13px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0,0,0,.25);
      }
      #panel .phead { font-size: 13px; font-weight: 700; color: var(--soft); margin: 4px 2px 12px; }
      #panel .empty { color: var(--faint); font-size: 13px; padding: 20px 6px; text-align: center; }
      .cmt-card { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; background: var(--surface); }
      .cmt-card.active { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
      .cmt-card .quote {
        font-size: 12px; color: var(--soft); background: var(--sunken);
        border-radius: 7px; padding: 6px 8px; margin-bottom: 8px; cursor: pointer;
        display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .cmt-card .quote::before { content: "“"; }
      .cmt-card .quote::after { content: "”"; }
      .cmt-card .sec { font-size: 11px; color: var(--brand-deep); font-weight: 600; margin-bottom: 6px; }
      .cmt-card .row { display: flex; gap: 6px; margin-bottom: 7px; }
      .cmt-card select { flex: 1; font: inherit; font-size: 12px; padding: 4px 6px; border: 1px solid var(--line2); border-radius: 7px; background: var(--surface); }
      .cmt-card textarea {
        width: 100%; font: inherit; font-size: 13px; border: 1px solid var(--line2);
        border-radius: 8px; padding: 7px 9px; resize: vertical; min-height: 56px;
      }
      .cmt-card textarea:focus, .cmt-card select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
      .cmt-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; }
      .cmt-card .del { font: inherit; font-size: 12px; color: var(--flag); background: none; border: none; cursor: pointer; padding: 2px; }
      .pri-高 { color: var(--flag); font-weight: 700; }
      .pill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
      .help { font-size: 12px; color: var(--faint); }

      @media (max-width: 980px) {
        .layout { flex-direction: column; }
        #panel { position: static; width: 100%; height: auto; border-left: none; border-top: 1px solid var(--line); }
        .shots { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>__TITLE__ <span class="sub">実装レビュー</span></h1>
      <span class="count" id="count">0 件</span>
      <span class="spacer"></span>
      <span class="help">テキストを選択 → 「💬 コメント」</span>
      <button class="btn" id="importBtn">読み込み</button>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button class="btn danger" id="clearBtn">全消去</button>
      <button class="btn primary" id="submitBtn">すべて書き出す</button>
    </div>

    <div class="layout">
      <main id="doc">
        <!--__DOC__-->
      </main>
      <aside id="panel">
        <div class="phead">コメント一覧</div>
        <div id="list"></div>
      </aside>
    </div>

    <button id="floatBtn">💬 コメント</button>

    <!-- mermaid（オフライン同梱）。review.js より前に読み込み、global mermaid を生やす -->
    <script>/*__MERMAID__*/</script>
    <!-- highlight.js（オフライン同梱）。review.js より前に読み込み、global hljs を生やす -->
    <script>/*__HLJS__*/</script>
    <script>
      window.REVIEW_CONFIG = {/*__CONFIG__*/};
      window.IMAGES = {/*__IMAGES__*/};
    </script>
    <script>
      /*__SCRIPT__*/
    </script>
  </body>
</html>
