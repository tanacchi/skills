prompt = "# Implement Feature\n\n## Objective\n\n既存設計に沿って feature を実装し、必要な validation を実行する。\n\n## Context To Gather\n\n- 要件と success criteria\n- 既存 entrypoint\n- 関連 component/service/test\n- 制約と non-goals\n\n## Steps\n\n1. repo context を読む。\n2. 実装範囲を絞る。\n3. 既存 pattern に沿って実装する。\n4. 必要な test を追加または更新する。\n5. validation を実行する。\n\n## Output Format\n\n- 変更概要\n- 主要ファイル\n- 実行した command\n- 残リスク\n\n## Safety\n\n不要な refactor、global install、destructive command は避ける。"
