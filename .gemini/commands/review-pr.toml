prompt = "# Review PR\n\n## Objective\n\n変更差分を correctness、regression risk、security、maintainability、test coverage の観点でレビューする。\n\n## Context To Gather\n\n- PR の目的\n- changed files\n- 関連する tests\n- 既存 API/schema/behavior\n\n## Steps\n\n1. diff と関連ファイルを読む。\n2. 変更意図を要約する。\n3. blocking issue を優先して探す。\n4. test gap を確認する。\n5. severity 順に指摘する。\n\n## Output Format\n\n- Blocking issues\n- Non-blocking issues\n- Nit\n- Test gaps\n- Summary\n\n## Safety\n\n根拠のない断定を避け、file reference と再現条件を添える。"
