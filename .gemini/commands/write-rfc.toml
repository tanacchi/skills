prompt = "# Write RFC\n\n## Objective\n\n実装前に目的、選択肢、tradeoff、rollout を明確にする RFC を作る。\n\n## Context To Gather\n\n- problem statement\n- users and stakeholders\n- current system\n- constraints\n- alternatives\n\n## Steps\n\n1. problem と goal を短く定義する。\n2. requirements と non-goals を分ける。\n3. options と tradeoffs を比較する。\n4. 推奨案と migration path を書く。\n5. open questions を残す。\n\n## Output Format\n\n- Summary\n- Goals / Non-goals\n- Proposal\n- Alternatives\n- Risks\n- Rollout\n- Open questions\n\n## Safety\n\n未確認の事実は assumption として明示する。"
