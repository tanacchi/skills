prompt = "# Debug Issue\n\n## Objective\n\n不具合や失敗ログを調査し、再現条件、原因候補、修正案を整理する。\n\n## Context To Gather\n\n- error message\n- reproduction steps\n- recent changes\n- logs and traces\n- related tests\n\n## Steps\n\n1. symptom と expected behavior を分ける。\n2. 再現条件を確認する。\n3. related code path を追う。\n4. 仮説を検証する。\n5. 最小修正と test を提案する。\n\n## Output Format\n\n- Symptom\n- Reproduction\n- Root cause or hypotheses\n- Fix\n- Tests\n\n## Safety\n\n原因が未確定なら断定せず、次に確認すべき事実を書く。"
